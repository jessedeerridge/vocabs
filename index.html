<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>て形 音声練習</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;color:#111;font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif}
.wrap{width:min(620px,94vw);margin:24px auto 60px}
.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:24px;box-shadow:0 5px 18px rgba(0,0,0,.06);text-align:center}
h1{font-size:23px;margin:0 0 8px}.sub{font-size:13px;color:#666;margin-bottom:18px}
.problem{font-size:54px;font-weight:900;min-height:110px;display:flex;align-items:center;justify-content:center;border:2px solid #222;border-radius:18px;margin-bottom:16px}
.recordBox{min-height:155px;border:3px solid #111;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;transition:background .15s,color .15s}
.recordBox.recording{background:#111;color:#fff}.recordMain{font-size:28px;font-weight:900}.recordSub{font-size:15px;margin-top:7px}
.meter{width:min(310px,86%);height:11px;border:1px solid currentColor;border-radius:999px;margin-top:14px;overflow:hidden;display:none}
.recordBox.recording .meter{display:block}
.meterFill{height:100%;width:0;background:currentColor}
.captureInfo{min-height:18px;margin-top:5px;font-size:11px;color:#999}
.result{min-height:44px;margin-top:14px;font-size:30px;font-weight:900}.ok{color:#087f23}.ng{color:#c62828}
.status{min-height:22px;margin-top:8px;font-size:14px;color:#666}
button{border:0;border-radius:13px;padding:14px 20px;font-size:17px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.hidden{display:none}
.debug{display:none;margin-top:7px;font-size:11px;color:#888}.debug.show{display:block}
.micPanel{margin-top:12px;padding:12px;border:1px solid #ccc;border-radius:12px;background:#fafafa;text-align:left}
.micPanel label{font-size:12px;color:#666}
.micRow{display:flex;gap:8px;margin-top:6px}
.micRow select{flex:1;min-width:0;padding:9px;border:1px solid #aaa;border-radius:9px;background:white}
.micRow button{padding:9px 12px;font-size:14px;background:#e9e9e9;color:#111}
.tech{margin-top:6px;font-size:11px;color:#888;word-break:break-word}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>て形 音声練習</h1>
<div class="sub">問題が出たら、て形を言ってください。　学生版 v8.4・正解時間軸判定</div>
<div id="problem" class="problem">読み込み中…</div>
<div id="recordBox" class="recordBox">
<div id="recordMain" class="recordMain">準備中</div>
<div id="recordSub" class="recordSub"></div>
<div class="meter"><div id="meterFill" class="meterFill"></div></div>
</div>
<div id="result" class="result"></div>
<div id="status" class="status"></div>
<div id="captureInfo" class="captureInfo"></div>
<div id="debug" class="debug"></div>

<div id="micPanel" class="micPanel">
  <label>使用するマイク</label>
  <div class="micRow">
    <select id="micSelect"></select>
    <button id="changeMic" type="button">変更</button>
  </div>
  <div id="tech" class="tech"></div>
</div>

<button id="startBtn" class="primary hidden">開始</button>
</div></div>

<script>
const ITEMS=[
["書きます","かいて"],
["聞きます","きいて"],
["読みます","よんで"],
["飲みます","のんで"],
["話します","はなして"],
["食べます","たべて"]
];

const $=s=>document.querySelector(s);
const problem=$("#problem"),recordBox=$("#recordBox"),recordMain=$("#recordMain"),
recordSub=$("#recordSub"),result=$("#result"),statusEl=$("#status"),
startBtn=$("#startBtn"),debugEl=$("#debug"),meterFill=$("#meterFill"),
captureInfo=$("#captureInfo"),micSelect=$("#micSelect"),
changeMic=$("#changeMic"),tech=$("#tech");

const DEBUG=new URLSearchParams(location.search).get("debug")==="1";
if(DEBUG)debugEl.classList.add("show");

let templates={},calibration={};
let stream=null,track=null,audioCtx=null,sourceNode=null,analyserNode=null,monitorGain=null;
let meterRAF=0;
let devices=[];
let micReady=false;
let currentIndex=0,started=false,running=false;


const FEATURE_VERSION=6;
const TARGET_SR=16000;

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function resample(x,from,to=TARGET_SR){
  if(from===to)return new Float32Array(x);
  const len=Math.max(1,Math.round(x.length*to/from));
  const out=new Float32Array(len);
  for(let i=0;i<len;i++){
    const p=i*from/to;
    const a=Math.floor(p);
    const b=Math.min(x.length-1,a+1);
    const t=p-a;
    out[i]=x[a]*(1-t)+x[b]*t;
  }
  return out;
}

function extractSpeech(x,sr=TARGET_SR){
  const frame=Math.round(sr*.02);
  const hop=Math.round(sr*.01);
  const rms=[];

  for(let p=0;p+frame<=x.length;p+=hop){
    let s=0;
    for(let i=0;i<frame;i++){
      const v=x[p+i];
      s+=v*v;
    }
    rms.push(Math.sqrt(s/frame));
  }

  if(!rms.length)throw new Error("録音が短すぎます");

  const sorted=[...rms].sort((a,b)=>a-b);
  const noise=sorted[Math.floor(sorted.length*.20)]||0;
  const peak=Math.max(...rms);

  // 絶対音量では弾かない。
  // 同じ録音の中で「静かな部分より明らかに大きい部分」を声として探す。
  let th=noise + (peak-noise)*.18;
  if(!(th>0)) th=peak*.12;

  let voiced=[];
  for(let i=0;i<rms.length;i++){
    if(rms[i]>=th)voiced.push(i);
  }

  // まだ取れない場合は、しきい値をさらに下げる。
  if(voiced.length<3){
    th=noise + (peak-noise)*.08;
    voiced=[];
    for(let i=0;i<rms.length;i++){
      if(rms[i]>=th)voiced.push(i);
    }
  }

  let a=0,b=x.length;

  if(voiced.length>=3){
    const first=Math.max(0,voiced[0]-7);
    const last=Math.min(rms.length-1,voiced[voiced.length-1]+9);
    a=first*hop;
    b=Math.min(x.length,last*hop+frame);
  }else{
    // 最後の保険：最もエネルギーが大きい場所を中心に使う。
    let best=0;
    for(let i=1;i<rms.length;i++){
      if(rms[i]>rms[best])best=i;
    }
    const half=Math.round(.65*sr);
    const center=best*hop+Math.floor(frame/2);
    a=Math.max(0,center-half);
    b=Math.min(x.length,center+half);
  }

  if(b-a<Math.round(sr*.12)){
    a=0;b=x.length;
  }

  const y=x.slice(a,b);

  // DC removal + gentle pre-emphasis.
  let mean=0;
  for(const v of y)mean+=v;
  mean/=Math.max(1,y.length);

  const out=new Float32Array(y.length);
  let prev=0;
  for(let i=0;i<y.length;i++){
    const cur=y[i]-mean;
    out[i]=i===0 ? cur : cur-.97*prev;
    prev=cur;
  }

  // 小さい声でも同じ大きさに正規化する。
  let s=0;
  for(const v of out)s+=v*v;
  const rr=Math.sqrt(s/Math.max(1,out.length));

  if(rr>0){
    const gain=Math.min(80,.08/rr);
    for(let i=0;i<out.length;i++)out[i]*=gain;
  }

  return out;
}

function fftMagPower(frame){
  const N=512;
  const re=new Float64Array(N);
  const im=new Float64Array(N);

  for(let i=0;i<frame.length && i<N;i++)re[i]=frame[i];

  // bit reversal
  for(let i=1,j=0;i<N;i++){
    let bit=N>>1;
    for(;j&bit;bit>>=1)j^=bit;
    j^=bit;
    if(i<j){
      const tr=re[i];re[i]=re[j];re[j]=tr;
    }
  }

  for(let len=2;len<=N;len<<=1){
    const ang=-2*Math.PI/len;
    const wlenR=Math.cos(ang),wlenI=Math.sin(ang);

    for(let i=0;i<N;i+=len){
      let wr=1,wi=0;
      const half=len>>1;

      for(let j=0;j<half;j++){
        const uR=re[i+j],uI=im[i+j];
        const k=i+j+half;
        const vR=re[k]*wr-im[k]*wi;
        const vI=re[k]*wi+im[k]*wr;

        re[i+j]=uR+vR;
        im[i+j]=uI+vI;
        re[k]=uR-vR;
        im[k]=uI-vI;

        const nwr=wr*wlenR-wi*wlenI;
        wi=wr*wlenI+wi*wlenR;
        wr=nwr;
      }
    }
  }

  const p=new Float64Array(N/2+1);
  for(let i=0;i<p.length;i++)p[i]=re[i]*re[i]+im[i]*im[i];
  return p;
}

function hzToMel(hz){return 2595*Math.log10(1+hz/700)}
function melToHz(m){return 700*(Math.pow(10,m/2595)-1)}

let MEL_BANK=null;
function getMelBank(){
  if(MEL_BANK)return MEL_BANK;

  const NFFT=512;
  const nFilters=26;
  const minHz=80,maxHz=7600;
  const minMel=hzToMel(minHz),maxMel=hzToMel(maxHz);
  const hz=[];

  for(let i=0;i<nFilters+2;i++){
    hz.push(melToHz(minMel+(maxMel-minMel)*i/(nFilters+1)));
  }

  const bins=hz.map(h=>Math.max(0,Math.min(NFFT/2,Math.floor((NFFT+1)*h/TARGET_SR))));
  const bank=[];

  for(let m=1;m<=nFilters;m++){
    const weights=[];
    const l=bins[m-1],c=bins[m],r=bins[m+1];

    for(let k=l;k<=r;k++){
      let w=0;
      if(k<c)w=(k-l)/Math.max(1,c-l);
      else if(k>c)w=(r-k)/Math.max(1,r-c);
      else w=1;

      if(w>0)weights.push([k,w]);
    }
    bank.push(weights);
  }

  MEL_BANK=bank;
  return bank;
}

function mfccSequence(raw){
  const x=extractSpeech(raw,TARGET_SR);
  const frameSize=400; // 25 ms
  const hop=160;       // 10 ms
  const bank=getMelBank();
  const staticSeq=[];

  for(let p=0;p+frameSize<=x.length;p+=hop){
    const fr=new Float64Array(512);

    for(let i=0;i<frameSize;i++){
      const win=.54-.46*Math.cos(2*Math.PI*i/(frameSize-1));
      fr[i]=x[p+i]*win;
    }

    const pow=fftMagPower(fr);
    const logs=[];

    for(const filt of bank){
      let e=0;
      for(const [k,w] of filt)e+=pow[k]*w;
      logs.push(Math.log(e+1e-10));
    }

    // MFCC 1..12. c0 is intentionally omitted.
    const row=[];
    const M=logs.length;
    for(let c=1;c<=12;c++){
      let s=0;
      for(let m=0;m<M;m++){
        s+=logs[m]*Math.cos(Math.PI*c*(m+.5)/M);
      }
      row.push(s);
    }
    staticSeq.push(row);
  }

  if(staticSeq.length<6)throw new Error("声が短すぎます");

  // Cepstral mean/variance normalization per utterance.
  const T=staticSeq.length,D=12;
  const mean=new Float64Array(D);
  const sd=new Float64Array(D);

  for(const row of staticSeq){
    for(let d=0;d<D;d++)mean[d]+=row[d];
  }
  for(let d=0;d<D;d++)mean[d]/=T;

  for(const row of staticSeq){
    for(let d=0;d<D;d++){
      const z=row[d]-mean[d];
      sd[d]+=z*z;
    }
  }
  for(let d=0;d<D;d++)sd[d]=Math.sqrt(sd[d]/T)||1;

  const norm=staticSeq.map(row=>row.map((v,d)=>(v-mean[d])/sd[d]));
  const out=[];

  for(let t=0;t<T;t++){
    const prev=norm[Math.max(0,t-2)];
    const next=norm[Math.min(T-1,t+2)];
    const row=[];

    for(let d=0;d<D;d++)row.push(norm[t][d]);
    for(let d=0;d<D;d++)row.push((next[d]-prev[d])*.25);

    out.push(row.map(v=>Math.round(v*1000)/1000));
  }

  return out;
}

function frameDistance(a,b){
  const D=Math.min(a.length,b.length);
  let staticS=0,deltaS=0;
  const half=Math.min(12,D);

  for(let d=0;d<half;d++){
    const q=a[d]-b[d];
    staticS+=q*q;
  }
  for(let d=12;d<D;d++){
    const q=a[d]-b[d];
    deltaS+=q*q;
  }

  const st=Math.sqrt(staticS/Math.max(1,half));
  const de=Math.sqrt(deltaS/Math.max(1,D-12));
  return st*.72+de*.28;
}

function dtw(A,B){
  const n=A.length,m=B.length;
  if(!n||!m)return Infinity;

  // Prevent pathological warping.
  const band=Math.max(8,Math.ceil(Math.max(n,m)*.38));
  const prev=new Float64Array(m+1);
  const prevLen=new Uint16Array(m+1);
  prev.fill(Infinity);
  prev[0]=0;

  for(let i=1;i<=n;i++){
    const cur=new Float64Array(m+1);
    const curLen=new Uint16Array(m+1);
    cur.fill(Infinity);

    const center=i*m/n;
    const j0=Math.max(1,Math.floor(center-band));
    const j1=Math.min(m,Math.ceil(center+band));

    for(let j=j0;j<=j1;j++){
      const c=frameDistance(A[i-1],B[j-1]);

      let best=prev[j-1],bl=prevLen[j-1];

      if(prev[j]<best){
        best=prev[j];bl=prevLen[j];
      }
      if(cur[j-1]<best){
        best=cur[j-1];bl=curLen[j-1];
      }

      if(Number.isFinite(best)){
        cur[j]=best+c;
        curLen[j]=bl+1;
      }
    }

    prev.set(cur);
    prevLen.set(curLen);
  }

  return prev[m]/Math.max(1,prevLen[m]);
}

function classScores(feat,templates){
  const scores=[];

  for(const [key,refs] of Object.entries(templates)){
    if(!Array.isArray(refs)||!refs.length)continue;

    const ds=[];
    for(const ref of refs){
      try{
        const d=dtw(feat,ref);
        if(Number.isFinite(d))ds.push(d);
      }catch{}
    }
    if(!ds.length)continue;

    ds.sort((a,b)=>a-b);
    const take=Math.min(2,ds.length);
    let score=0;
    for(let i=0;i<take;i++)score+=ds[i];
    score/=take;

    scores.push({key,score});
  }

  scores.sort((a,b)=>a.score-b.score);
  return scores;
}

function classCalibration(key,templates){
  const refs=templates[key]||[];
  const within=[];

  for(let i=0;i<refs.length;i++){
    for(let j=i+1;j<refs.length;j++){
      const d=dtw(refs[i],refs[j]);
      if(Number.isFinite(d))within.push(d);
    }
  }

  within.sort((a,b)=>a-b);
  const median=within.length
    ? within[Math.floor(within.length/2)]
    : Infinity;
  const max=within.length ? within[within.length-1] : Infinity;

  // Nearest other-class reference. This is used only to keep acceptance
  // well inside the class boundary.
  let nearestOther=Infinity;
  for(const [other,orefs] of Object.entries(templates)){
    if(other===key)continue;
    for(const a of refs){
      for(const b of orefs||[]){
        const d=dtw(a,b);
        if(d<nearestOther)nearestOther=d;
      }
    }
  }

  let limit=Infinity;
  if(Number.isFinite(median)){
    limit=Math.max(median*2.0,max*1.45);
  }
  if(Number.isFinite(nearestOther)){
    limit=Math.min(limit,nearestOther*.78);
  }

  return {median,max,nearestOther,limit};
}


async function loadTemplates(){
  const res=await fetch("./voice_templates.json?v="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("voice_templates.json を読み込めません");

  const data=await res.json();

  if(data.version!==FEATURE_VERSION){
    throw new Error("正解音声データが旧方式です。v6で登録し直してください");
  }

  templates=data.templates||{};
  calibration=data.calibration||{};
}


function stopMic(){
  try{cancelAnimationFrame(meterRAF)}catch{}
  try{sourceNode?.disconnect()}catch{}
  try{analyserNode?.disconnect()}catch{}
  try{monitorGain?.disconnect()}catch{}
  try{stream?.getTracks().forEach(t=>t.stop())}catch{}
  try{audioCtx?.close()}catch{}

  stream=track=audioCtx=sourceNode=analyserNode=monitorGain=null;
  micReady=false;
  meterFill.style.width="0%";
}

async function refreshDevices(){
  const all=await navigator.mediaDevices.enumerateDevices();
  devices=all.filter(d=>d.kind==="audioinput");

  const previous=micSelect.value;
  micSelect.innerHTML="";

  devices.forEach((d,i)=>{
    const op=document.createElement("option");
    op.value=d.deviceId;
    op.textContent=d.label||`マイク ${i+1}`;
    micSelect.appendChild(op);
  });

  if(previous && devices.some(d=>d.deviceId===previous)){
    micSelect.value=previous;
  }
}

function startMeter(){
  cancelAnimationFrame(meterRAF);
  if(!analyserNode)return;

  const buf=new Float32Array(analyserNode.fftSize);

  const tick=()=>{
    if(!analyserNode)return;

    analyserNode.getFloatTimeDomainData(buf);

    let peak=0;
    for(let i=0;i<buf.length;i++){
      const a=Math.abs(buf[i]);
      if(a>peak)peak=a;
    }

    const pct=Math.min(100,Math.round(Math.sqrt(peak)*180));
    meterFill.style.width=pct+"%";
    meterRAF=requestAnimationFrame(tick);
  };

  tick();
}

async function openMic(deviceId=null){
  stopMic();

  // v6で追加した音声処理の強制指定をやめる。
  // 実際に録音できた版と同じく、ブラウザに素のマイクを要求する。
  let constraints={audio:true,video:false};

  if(deviceId){
    constraints={
      video:false,
      audio:{deviceId:{exact:deviceId}}
    };
  }

  stream=await navigator.mediaDevices.getUserMedia(constraints);
  track=stream.getAudioTracks()[0];

  if(!track)throw new Error("マイクを取得できません");

  track.enabled=true;

  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")await audioCtx.resume();

  sourceNode=audioCtx.createMediaStreamSource(stream);

  // 常時監視はメーターだけ。
  analyserNode=audioCtx.createAnalyser();
  analyserNode.fftSize=1024;
  analyserNode.smoothingTimeConstant=.10;

  monitorGain=audioCtx.createGain();
  monitorGain.gain.value=.000001;

  sourceNode.connect(analyserNode);
  analyserNode.connect(monitorGain);
  monitorGain.connect(audioCtx.destination);

  startMeter();

  await refreshDevices();

  const settings=track.getSettings?.()||{};
  if(settings.deviceId && devices.some(d=>d.deviceId===settings.deviceId)){
    micSelect.value=settings.deviceId;
  }

  tech.textContent=
    `使用中: ${track.label||"マイク"} / `+
    `state=${track.readyState} / muted=${track.muted} / `+
    `${Math.round(audioCtx.sampleRate)}Hz`;

  track.onmute=()=>{
    tech.textContent=`使用中: ${track.label||"マイク"} / muted=true`;
  };

  track.onunmute=()=>{
    tech.textContent=`使用中: ${track.label||"マイク"} / muted=false`;
  };

  micReady=true;

  // AudioContextとマイクが安定してから最初の録音へ。
  await sleep(350);
}

async function ensureMic(){
  if(
    micReady &&
    stream?.active &&
    track?.readyState==="live" &&
    audioCtx &&
    sourceNode
  ){
    if(audioCtx.state==="suspended")await audioCtx.resume();
    return;
  }

  await openMic(micSelect.value||null);
}

// ここは「以前、実際に録音できた」方式へ戻す。
// 録音する1.9秒だけ sourceNode から直接 ScriptProcessor を分岐する。
async function capture(ms=1900){
  await ensureMic();

  if(audioCtx.state==="suspended"){
    await audioCtx.resume();
    await sleep(100);
  }

  const proc=audioCtx.createScriptProcessor(2048,1,1);
  const sink=audioCtx.createGain();
  sink.gain.value=.000001;

  const parts=[];
  let peak=0;
  let callbacks=0;

  proc.onaudioprocess=e=>{
    callbacks++;

    const ch=e.inputBuffer.getChannelData(0);
    const copy=new Float32Array(ch.length);
    copy.set(ch);
    parts.push(copy);

    for(let i=0;i<ch.length;i++){
      const a=Math.abs(ch[i]);
      if(a>peak)peak=a;
    }
  };

  // analyserを経由せず、マイクsourceから録音処理へ直接接続。
  sourceNode.connect(proc);
  proc.connect(sink);
  sink.connect(audioCtx.destination);

  await sleep(ms);

  try{sourceNode.disconnect(proc)}catch{}
  try{proc.disconnect()}catch{}
  try{sink.disconnect()}catch{}

  const total=parts.reduce((n,a)=>n+a.length,0);
  const raw=new Float32Array(total);

  let pos=0;
  for(const a of parts){
    raw.set(a,pos);
    pos+=a.length;
  }

  captureInfo.textContent=
    `入力=${peak.toFixed(5)} / `+
    `frames=${callbacks} / samples=${raw.length}`;

  if(callbacks===0 || raw.length===0){
    throw new Error("録音フレームが届いていません");
  }

  if(peak<0.0000001){
    throw new Error("録音データが0です。上のマイクを変更してください");
  }

  return resample(raw,audioCtx.sampleRate,TARGET_SR);
}

function newQuestion(){
  let n;
  do{n=Math.floor(Math.random()*ITEMS.length)}
  while(n===currentIndex&&ITEMS.length>1);

  currentIndex=n;
  problem.textContent=ITEMS[n][0];
  result.textContent="";
  statusEl.textContent="";
}


function percentile(arr,p){
  if(!arr.length)return Infinity;
  const a=[...arr].sort((x,y)=>x-y);
  const pos=(a.length-1)*p;
  const lo=Math.floor(pos),hi=Math.ceil(pos);
  if(lo===hi)return a[lo];
  const t=pos-lo;
  return a[lo]*(1-t)+a[hi]*t;
}

function dtwLocalStats(A,B){
  const n=A.length,m=B.length;
  if(!n||!m)return {mean:Infinity,local:Infinity,excess:Infinity,pathLength:0};

  const band=Math.max(8,Math.ceil(Math.max(n,m)*.38));
  const W=m+1;
  const cost=new Float64Array((n+1)*(m+1));
  const move=new Uint8Array((n+1)*(m+1));
  cost.fill(Infinity);
  cost[0]=0;

  for(let i=1;i<=n;i++){
    const center=i*m/n;
    const j0=Math.max(1,Math.floor(center-band));
    const j1=Math.min(m,Math.ceil(center+band));

    for(let j=j0;j<=j1;j++){
      const idx=i*W+j;
      const c=frameDistance(A[i-1],B[j-1]);

      const diag=cost[(i-1)*W+(j-1)];
      const up=cost[(i-1)*W+j];
      const left=cost[i*W+(j-1)];

      let best=diag,dir=1;
      if(up<best){best=up;dir=2}
      if(left<best){best=left;dir=3}

      if(Number.isFinite(best)){
        cost[idx]=best+c;
        move[idx]=dir;
      }
    }
  }

  if(!Number.isFinite(cost[n*W+m])){
    return {mean:Infinity,local:Infinity,excess:Infinity,pathLength:0};
  }

  let i=n,j=m;
  const dists=[];

  while(i>0 && j>0){
    dists.push(frameDistance(A[i-1],B[j-1]));
    const dir=move[i*W+j];
    if(dir===1){i--;j--}
    else if(dir===2){i--}
    else if(dir===3){j--}
    else break;
  }

  dists.reverse();
  if(!dists.length)return {mean:Infinity,local:Infinity,excess:Infinity,pathLength:0};

  const mean=dists.reduce((s,v)=>s+v,0)/dists.length;

  const win=Math.max(5,Math.min(11,Math.round(dists.length*.075)));
  const smooth=[];
  let sum=0;

  for(let k=0;k<dists.length;k++){
    sum+=dists[k];
    if(k>=win)sum-=dists[k-win];
    if(k>=win-1)smooth.push(sum/win);
  }

  const base=percentile(smooth,0.50);
  const local=percentile(smooth,0.90);

  // 全体的な声質差ではなく「一部分だけ大きく違う」度合いを見る。
  const excess=(local-base)/(base+0.35);

  return {mean,base,local,excess,pathLength:dists.length};
}

const localCalCache={};

function localCalibration(key){
  if(localCalCache[key])return localCalCache[key];

  const refs=templates[key]||[];
  const vals=[];

  for(let i=0;i<refs.length;i++){
    for(let j=i+1;j<refs.length;j++){
      const s=dtwLocalStats(refs[i],refs[j]);
      if(Number.isFinite(s.excess))vals.push(s.excess);
    }
  }

  vals.sort((a,b)=>a-b);

  const med=vals.length ? vals[Math.floor(vals.length/2)] : Infinity;
  const mx=vals.length ? vals[vals.length-1] : Infinity;

  const limit=Number.isFinite(mx)
    ? Math.max(mx*1.65,med*1.90,0.42)
    : Infinity;

  const out={median:med,max:mx,limit};
  localCalCache[key]=out;
  return out;
}

function targetLocalScore(feat,key){
  const refs=templates[key]||[];
  const stats=[];

  for(const ref of refs){
    const s=dtwLocalStats(feat,ref);
    if(Number.isFinite(s.mean)&&Number.isFinite(s.excess))stats.push(s);
  }

  if(!stats.length){
    return {mean:Infinity,excess:Infinity,local:Infinity,base:Infinity};
  }

  const medOf = prop => {
    const a=stats.map(s=>s[prop]).sort((x,y)=>x-y);
    return a[Math.floor(a.length/2)];
  };

  return {
    mean:medOf("mean"),
    base:medOf("base"),
    local:medOf("local"),
    excess:medOf("excess")
  };
}


function alignedDistances(A,B){
  const n=A.length,m=B.length;
  if(!n||!m)return [];

  const band=Math.max(8,Math.ceil(Math.max(n,m)*.38));
  const W=m+1;
  const cost=new Float64Array((n+1)*(m+1));
  const move=new Uint8Array((n+1)*(m+1));
  cost.fill(Infinity);
  cost[0]=0;

  for(let i=1;i<=n;i++){
    const center=i*m/n;
    const j0=Math.max(1,Math.floor(center-band));
    const j1=Math.min(m,Math.ceil(center+band));

    for(let j=j0;j<=j1;j++){
      const idx=i*W+j;
      const c=frameDistance(A[i-1],B[j-1]);

      const diag=cost[(i-1)*W+(j-1)];
      const up=cost[(i-1)*W+j];
      const left=cost[i*W+(j-1)];

      let best=diag,dir=1;
      if(up<best){best=up;dir=2}
      if(left<best){best=left;dir=3}

      if(Number.isFinite(best)){
        cost[idx]=best+c;
        move[idx]=dir;
      }
    }
  }

  if(!Number.isFinite(cost[n*W+m]))return [];

  let i=n,j=m;
  const d=[];

  while(i>0 && j>0){
    d.push(frameDistance(A[i-1],B[j-1]));
    const dir=move[i*W+j];
    if(dir===1){i--;j--}
    else if(dir===2){i--}
    else if(dir===3){j--}
    else break;
  }

  d.reverse();
  return d;
}

function maxWindowAverage(arr,win){
  if(!arr.length)return Infinity;
  if(arr.length<=win)return arr.reduce((s,v)=>s+v,0)/arr.length;

  let sum=0,max=-Infinity;
  for(let i=0;i<arr.length;i++){
    sum+=arr[i];
    if(i>=win)sum-=arr[i-win];
    if(i>=win-1)max=Math.max(max,sum/win);
  }
  return max;
}

function multiScaleLocalStats(A,B){
  const d=alignedDistances(A,B);
  if(!d.length){
    return {short:Infinity,medium:Infinity,long:Infinity,mean:Infinity};
  }

  const mean=d.reduce((s,v)=>s+v,0)/d.length;

  // 約80ms / 160ms / 300ms 相当の3段階。
  // 1音の違い、短いまとまりの違い、語尾や語中のまとまった違いを全部見る。
  const short=maxWindowAverage(d,8);
  const medium=maxWindowAverage(d,16);
  const long=maxWindowAverage(d,30);

  return {short,medium,long,mean};
}

const multiCalCache={};

function multiScaleCalibration(key){
  if(multiCalCache[key])return multiCalCache[key];

  const refs=templates[key]||[];
  const vals={short:[],medium:[],long:[],mean:[]};

  for(let i=0;i<refs.length;i++){
    for(let j=i+1;j<refs.length;j++){
      const s=multiScaleLocalStats(refs[i],refs[j]);
      for(const k of Object.keys(vals)){
        if(Number.isFinite(s[k]))vals[k].push(s[k]);
      }
    }
  }

  const makeLimit=(arr,mulMed,mulMax,floor)=>{
    arr.sort((a,b)=>a-b);
    if(!arr.length)return Infinity;
    const med=arr[Math.floor(arr.length/2)];
    const mx=arr[arr.length-1];
    return Math.max(med*mulMed,mx*mulMax,floor);
  };

  // 固定の語尾ではなく、どこに違いがあっても同じ基準。
  const out={
    short:makeLimit(vals.short,1.75,1.55,0.72),
    medium:makeLimit(vals.medium,1.70,1.50,0.62),
    long:makeLimit(vals.long,1.65,1.45,0.55),
    mean:makeLimit(vals.mean,1.75,1.55,0.42)
  };

  multiCalCache[key]=out;
  return out;
}

function targetMultiScaleScore(feat,key){
  const refs=templates[key]||[];
  const stats=[];

  for(const ref of refs){
    const s=multiScaleLocalStats(feat,ref);
    if(Number.isFinite(s.mean))stats.push(s);
  }

  if(!stats.length){
    return {short:Infinity,medium:Infinity,long:Infinity,mean:Infinity};
  }

  const med=(prop)=>{
    const a=stats.map(s=>s[prop]).sort((x,y)=>x-y);
    return a[Math.floor(a.length/2)];
  };

  return {
    short:med("short"),
    medium:med("medium"),
    long:med("long"),
    mean:med("mean")
  };
}


function smoothDistances(arr,win=7){
  if(!arr.length)return [];
  if(arr.length<=win){
    return [arr.reduce((s,v)=>s+v,0)/arr.length];
  }
  const out=[];
  let sum=0;
  for(let i=0;i<arr.length;i++){
    sum+=arr[i];
    if(i>=win)sum-=arr[i-win];
    if(i>=win-1)out.push(sum/win);
  }
  return out;
}

function longestBadRunRatio(values,threshold){
  if(!values.length)return 1;
  let cur=0,max=0;
  for(const v of values){
    if(v>threshold){
      cur++;
      if(cur>max)max=cur;
    }else{
      cur=0;
    }
  }
  return max/values.length;
}

const coverageCalCache={};

function coverageCalibration(key){
  if(coverageCalCache[key])return coverageCalCache[key];

  const refs=templates[key]||[];
  const all=[];

  for(let i=0;i<refs.length;i++){
    for(let j=i+1;j<refs.length;j++){
      const d=alignedDistances(refs[i],refs[j]);
      const s=smoothDistances(d,7);
      for(const v of s){
        if(Number.isFinite(v))all.push(v);
      }
    }
  }

  all.sort((a,b)=>a-b);

  if(!all.length){
    const out={threshold:Infinity};
    coverageCalCache[key]=out;
    return out;
  }

  const med=percentile(all,.50);
  const p90=percentile(all,.90);
  const p95=percentile(all,.95);

  const threshold=Math.max(
    p95*1.28,
    p90*1.38,
    med*1.85,
    .58
  );

  const out={threshold,median:med,p90,p95};
  coverageCalCache[key]=out;
  return out;
}

function coverageAgainstReference(feat,ref,threshold){
  const d=alignedDistances(feat,ref);
  const s=smoothDistances(d,7);

  if(!s.length){
    return {coverage:0,badRun:1,p80:Infinity,count:0};
  }

  let good=0;
  for(const v of s){
    if(v<=threshold)good++;
  }

  return {
    coverage:good/s.length,
    badRun:longestBadRunRatio(s,threshold),
    p80:percentile(s,.80),
    count:s.length
  };
}

function targetCoverageScore(feat,key){
  const refs=templates[key]||[];
  const cal=coverageCalibration(key);
  const results=[];

  for(const ref of refs){
    const r=coverageAgainstReference(feat,ref,cal.threshold);
    if(r.count)results.push(r);
  }

  if(!results.length){
    return {
      coverage:0,
      badRun:1,
      p80:Infinity,
      threshold:cal.threshold
    };
  }

  results.sort((a,b)=>b.coverage-a.coverage);
  const best=results.slice(0,Math.min(2,results.length));
  const avg=prop=>best.reduce((s,r)=>s+r[prop],0)/best.length;

  return {
    coverage:avg("coverage"),
    badRun:avg("badRun"),
    p80:avg("p80"),
    threshold:cal.threshold
  };
}


function dtwAlignedPairs(A,B){
  const n=A.length,m=B.length;
  if(!n||!m)return [];

  const band=Math.max(8,Math.ceil(Math.max(n,m)*.32));
  const W=m+1;
  const cost=new Float64Array((n+1)*(m+1));
  const move=new Uint8Array((n+1)*(m+1));
  cost.fill(Infinity);
  cost[0]=0;

  for(let i=1;i<=n;i++){
    const center=i*m/n;
    const j0=Math.max(1,Math.floor(center-band));
    const j1=Math.min(m,Math.ceil(center+band));

    for(let j=j0;j<=j1;j++){
      const idx=i*W+j;
      const c=frameDistance(A[i-1],B[j-1]);

      const diag=cost[(i-1)*W+(j-1)];
      const up=cost[(i-1)*W+j] + 0.035;    // 伸縮しすぎを少し罰する
      const left=cost[i*W+(j-1)] + 0.035;

      let best=diag,dir=1;
      if(up<best){best=up;dir=2}
      if(left<best){best=left;dir=3}

      if(Number.isFinite(best)){
        cost[idx]=best+c;
        move[idx]=dir;
      }
    }
  }

  if(!Number.isFinite(cost[n*W+m]))return [];

  let i=n,j=m;
  const pairs=[];

  while(i>0 && j>0){
    pairs.push({
      qi:i-1,
      ri:j-1,
      d:frameDistance(A[i-1],B[j-1])
    });

    const dir=move[i*W+j];
    if(dir===1){i--;j--}
    else if(dir===2){i--}
    else if(dir===3){j--}
    else break;
  }

  pairs.reverse();
  return pairs;
}

function referenceTimelineProfile(query,ref,bins){
  const pairs=dtwAlignedPairs(query,ref);
  if(!pairs.length)return [];

  // 正解音声(ref)の時間軸をbins個に固定分割。
  // DTWが違う部分を短く圧縮しても、各binは必ず同じ重さで評価される。
  const bucket=Array.from({length:bins},()=>[]);

  for(const p of pairs){
    const x=ref.length<=1 ? 0 : p.ri/(ref.length-1);
    const b=Math.min(bins-1,Math.floor(x*bins));
    bucket[b].push(p.d);
  }

  const profile=[];
  for(let b=0;b<bins;b++){
    const arr=bucket[b];
    if(!arr.length){
      profile.push(Infinity);
      continue;
    }
    arr.sort((a,b)=>a-b);

    // 最小値ではなく中央値。偶然1フレームだけ似ていても通さない。
    profile.push(arr[Math.floor(arr.length/2)]);
  }

  return profile;
}

const timelineCalCache={};

function timelineCalibration(key,bins){
  const cacheKey=key+"|"+bins;
  if(timelineCalCache[cacheKey])return timelineCalCache[cacheKey];

  const refs=templates[key]||[];
  const perBin=Array.from({length:bins},()=>[]);

  for(let i=0;i<refs.length;i++){
    for(let j=i+1;j<refs.length;j++){
      const p=referenceTimelineProfile(refs[i],refs[j],bins);
      if(p.length!==bins)continue;
      for(let b=0;b<bins;b++){
        if(Number.isFinite(p[b]))perBin[b].push(p[b]);
      }
    }
  }

  const limits=perBin.map(arr=>{
    if(!arr.length)return Infinity;
    arr.sort((a,b)=>a-b);
    const med=arr[Math.floor(arr.length/2)];
    const mx=arr[arr.length-1];

    // 各位置ごとの正解録音3回の揺れを基準にする。
    return Math.max(mx*1.55,med*1.80,0.52);
  });

  const out={limits};
  timelineCalCache[cacheKey]=out;
  return out;
}

function targetTimelineScore(feat,key){
  const refs=templates[key]||[];

  // 短い語ほど細かく見る。
  // 3モーラなら9区間、4モーラなら12区間。
  const moraCount=Math.max(1,Array.from(key).length);
  const bins=Math.max(9,Math.min(24,moraCount*3));

  const cal=timelineCalibration(key,bins);
  const profiles=[];

  for(const ref of refs){
    const p=referenceTimelineProfile(feat,ref,bins);
    if(p.length===bins)profiles.push(p);
  }

  if(!profiles.length){
    return {
      bins,
      goodRatio:0,
      badBins:bins,
      longestBadRun:bins,
      profile:[],
      limits:cal.limits
    };
  }

  // 登録3回のうち2回以上で合うことを重視。
  const merged=[];
  for(let b=0;b<bins;b++){
    const vals=profiles
      .map(p=>p[b])
      .filter(Number.isFinite)
      .sort((a,b)=>a-b);

    if(!vals.length){
      merged.push(Infinity);
    }else if(vals.length===1){
      merged.push(vals[0]);
    }else{
      // 近い2回の平均
      merged.push((vals[0]+vals[1])/2);
    }
  }

  const good=[];
  for(let b=0;b<bins;b++){
    good.push(
      Number.isFinite(cal.limits[b]) &&
      Number.isFinite(merged[b]) &&
      merged[b] <= cal.limits[b]
    );
  }

  const goodCount=good.filter(Boolean).length;
  const badBins=bins-goodCount;

  let cur=0,longestBadRun=0;
  for(const g of good){
    if(g){
      cur=0;
    }else{
      cur++;
      if(cur>longestBadRun)longestBadRun=cur;
    }
  }

  return {
    bins,
    goodRatio:goodCount/bins,
    badBins,
    longestBadRun,
    good,
    profile:merged,
    limits:cal.limits
  };
}

function judge(feat,target){
  const scores=classScores(feat,templates);
  if(!scores.length)return {correct:false,best:null,scores};

  const best=scores[0];
  const second=scores[1]||null;

  // ① 語全体でも正解語が最接近であること。
  if(best.key!==target){
    return {
      correct:false,best,second,scores,
      reason:"word"
    };
  }

  // ② 正解音声の時間軸を固定して、最初から最後まで全部を見る。
  const tl=targetTimelineScore(feat,target);

  const moraCount=Math.max(1,Array.from(target).length);

  // 3～4モーラ程度の短語では、1モーラ違いを逃さないよう特に厳しく。
  let minGoodRatio=.88;
  let maxBadRun=1;

  if(moraCount<=3){
    minGoodRatio=.92;
    maxBadRun=1;
  }else if(moraCount===4){
    minGoodRatio=.90;
    maxBadRun=1;
  }else{
    minGoodRatio=.86;
    maxBadRun=2;
  }

  const coveragePass=tl.goodRatio>=minGoodRatio;
  const runPass=tl.longestBadRun<=maxBadRun;

  const correct=coveragePass&&runPass;

  return {
    correct,
    best,second,scores,
    timeline:tl,
    minGoodRatio,
    maxBadRun,
    coveragePass,
    runPass,
    reason:correct ? "ok" : "timeline"
  };
}

async function attempt(){
  const target=ITEMS[currentIndex][1];

  result.textContent="";
  statusEl.textContent="";

  await sleep(600);

  recordBox.classList.add("recording");
  recordMain.textContent="録音中";
  recordSub.textContent="いま言ってください";

  const pcm=await capture(1900);

  recordBox.classList.remove("recording");
  recordMain.textContent="";
  recordSub.textContent="";

  const feat=mfccSequence(pcm);
  const j=judge(feat,target);

  if(!j.best)throw new Error("正解音声データがありません");

  if(DEBUG){
    const word=j.scores.slice(0,4).map(x=>`${x.key}:${x.score.toFixed(3)}`).join(" / ");
    const tl=j.timeline
      ? ` / 正解区間=${j.timeline.good.filter(Boolean).length}/${j.timeline.bins}`
        +` / 最大連続×=${j.timeline.longestBadRun}`
      : "";
    debugEl.textContent=word+tl;
  }

  if(j.correct){
    result.textContent="○";
    result.className="result ok";
    await sleep(600);
    newQuestion();
  }else{
    result.textContent="×";
    result.className="result ng";
    if(j.reason==="timeline"){
      const ok=j.timeline.good.filter(Boolean).length;
      statusEl.textContent=`正解音声との一致 ${ok}/${j.timeline.bins} 区間`;
    }else{
      statusEl.textContent=`いちばん近い音：${j.best.key}`;
    }
    await sleep(850);
  }
}

async function practiceLoop(){
  if(running)return;
  running=true;
  try{
    while(started){
      try{
        await attempt();
      }catch(e){
        console.error(e);
        recordBox.classList.remove("recording");
        recordMain.textContent="もう一度";
        recordSub.textContent="";
        statusEl.textContent=e.message||String(e);
        await sleep(900);
      }
    }
  }finally{
    running=false;
  }
}
